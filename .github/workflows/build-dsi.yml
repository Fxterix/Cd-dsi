name: Build Sonic CD DSi

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Manual Install devkitPro and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl build-essential make libarchive-tools
          
          # Crear la estructura de directorios de devkitPro manualmente
          sudo mkdir -p /opt/devkitpro/pacman/etc/pacman.d/gnupg
          sudo mkdir -p /opt/devkitpro/pacman/var/lib/pacman
          sudo mkdir -p /opt/devkitpro/pacman/var/cache/pacman/pkg
          
          # Descargar e instalar el paquete pacman de devkitpro directamente desde github o mirrors alternativos sin usar el script oficial roto
          wget https://github.com/devkitPro/pacman-package/releases/download/v1.0.2/devkitpro-pacman.deb
          sudo dpkg -i devkitpro-pacman.deb || true
          sudo apt-get install -f -y
          
          # Configurar llaves de pacman de forma segura
          sudo /opt/devkitpro/pacman/bin/pacman-key --init
          sudo /opt/devkitpro/pacman/bin/pacman-key --populate devkitpro || true
          
          # Instalar herramientas para DSi (devkitARM, libnds)
          sudo dkp-pacman -S --noconfirm devkitARM nds-dev || sudo /opt/devkitpro/pacman/bin/pacman -S --noconfirm devkitARM nds-dev

      - name: Compile game with Make
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:$PATH
          
          cd RSDKv3
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-cd-dsi
          path: |
            RSDKv3/build/*.nds
            RSDKv3/build/*.dsi
