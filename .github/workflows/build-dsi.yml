name: Build Sonic CD DSi

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devkitPro and DSi tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl gdebi-core
          
          # Usar el método oficial estándar con wget para el script instalador de devkitPro
          wget --user-agent="Mozilla" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          
          # Permitir que el script corra creando primero las carpetas de seguridad necesarias
          sudo mkdir -p /opt/devkitpro/pacman/etc/pacman.d/gnupg
          sudo ./install-devkitpro-pacman
          
          # Instalar devkitARM y las herramientas de Nintendo DS/DSi
          sudo dkp-pacman -S --noconfirm devkitARM nds-dev

      - name: Compile game
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:$PATH
          make -C RSDKv3 PLATFORM=dsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-cd-dsi
          path: |
            RSDKv3/*.nds
            RSDKv3/*.dsi
