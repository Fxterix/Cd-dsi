name: Build Sonic CD DSi

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devkitPro and DSi tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl gdebi-core
          
          # Descargar e instalar directamente el paquete .deb de pacman de devkitPro
          wget --user-agent="Mozilla" https://github.com/devkitPro/pacman/releases/latest/download/devkitpro-pacman.amd64.deb -O devkitpro-pacman.deb
          sudo gdebi --non-interactive devkitpro-pacman.deb
          
          # Configurar las llaves y la ruta de forma limpia
          sudo mkdir -p /opt/devkitpro/pacman/etc/pacman.d/gnupg
          sudo /opt/devkitpro/pacman/bin/pacman-key --init
          sudo /opt/devkitpro/pacman/bin/pacman-key --populate devkitpro
          
          # Sincronizar y actualizar con dkp-pacman usando los paquetes correctos para DS/DSi
          sudo dkp-pacman -Syy --noconfirm devkitARM nds-dev

      - name: Compile game
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:$PATH
          make -C RSDKv3 PLATFORM=dsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-cd-dsi
          path: |
            RSDKv3/*.nds
            RSDKv3/*.dsi
