name: Build Sonic CD DSi

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devkitPro and DSi tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl gdebi-core build-essential make
          
          # Descargar el script de instalación simulando un navegador con -U para evitar bloqueos 403
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          
          # Ejecutar el instalador
          sudo ./install-devkitpro-pacman
          
          # Inicializar llaves de pacman de forma segura
          sudo mkdir -p /opt/devkitpro/pacman/etc/pacman.d/gnupg
          sudo /opt/devkitpro/pacman/bin/pacman-key --init || true
          sudo /opt/devkitpro/pacman/bin/pacman-key --populate devkitpro || true
          
          # Instalar los paquetes directamente sin forzar sincronización masiva que active el WAF
          sudo /opt/devkitpro/pacman/bin/pacman -S --noconfirm devkitARM nds-dev || sudo dkp-pacman -S --noconfirm devkitARM nds-dev

      - name: Compile game with Make
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:$PATH
          
          cd RSDKv3
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-cd-dsi
          path: |
            RSDKv3/build/*.nds
            RSDKv3/build/*.dsi
