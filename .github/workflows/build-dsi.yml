name: Build Sonic CD DSi

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devkitPro and DSi tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl gdebi-core
          
          # Descargar el script de instalación
          wget --user-agent="Mozilla" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          
          # Evitar que el script ejecute pacman -Syy al final pasando una variable o modificándolo,
          # o ejecutándolo y luego reintentando la sincronización de manera correcta.
          # Una forma limpia es deshabilitar la actualización automática editando el script antes de correrlo:
          sed -i 's/dkp-pacman -Syy/# dkp-pacman -Syy/g' install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          
          # Inicializar manualmente el llavero de pacman y sincronizar con reintentos
          sudo dkg-keys --init || true
          sudo /opt/devkitpro/pacman/bin/pacman-key --init
          sudo /opt/devkitpro/pacman/bin/pacman-key --populate devkitpro
          
          # Instalar herramientas para DSi (devkitARM, libnds, etc.)
          sudo dkp-pacman -S --noconfirm devkitARM dsi-dev

      - name: Compile game
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:$PATH
          make -C RSDKv3 PLATFORM=dsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-cd-dsi
          path: |
            RSDKv3/*.nds
            RSDKv3/*.dsi
