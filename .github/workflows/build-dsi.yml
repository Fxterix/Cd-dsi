name: Build Sonic CD DSi

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devkitPro and DSi tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl gdebi-core
          sudo wget https://apt.devkitpro.org/devkitpro-keyring.gpg -O /usr/share/keyrings/devkitpro-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/devkitpro-keyring.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo dkp-pacman -Syy --noconfirm devkitARM dsi-dev

      - name: Compile game
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:$PATH
          make -C RSDKv3 PLATFORM=dsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-cd-dsi
          path: |
            RSDKv3/*.nds
            RSDKv3/*.dsi
